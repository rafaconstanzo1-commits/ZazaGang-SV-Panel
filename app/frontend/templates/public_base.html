<!DOCTYPE html>
<html lang="{{ data['lang_page'] }}" class="default dashboard-theme">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  {% block meta %}{% end %}
  <title>{% block title %}{{ _('Default') }}{% end %}</title>
  <!-- plugins:css -->
  <link rel="stylesheet" href="/static/assets/vendors/mdi/css/materialdesignicons.min.css" />
  <link rel="stylesheet" href="/static/assets/vendors/flag-icon-css/css/flag-icon.min.css" />
  <link rel="stylesheet" href="/static/assets/vendors/ti-icons/css/themify-icons.css" />
  <link rel="stylesheet" href="/static/assets/vendors/typicons/typicons.css" />
  <link rel="stylesheet" href="/static/assets/vendors/css/vendor.bundle.base.css" />
  <link rel="stylesheet" href="/static/assets/vendors/fontawesome6/css/all.css" />
  <link rel="stylesheet" href="/static/assets/vendors/phosphoricons/regular/style.css">
  <link rel="stylesheet" href="/static/assets/vendors/phosphoricons/fill/style.css">
  <link rel="stylesheet" href="/static/assets/vendors/phosphoricons/bold/style.css">
  <link rel="stylesheet" href="/static/assets/vendors/phosphoricons/duotone/style.css">
  <link rel="stylesheet" href="/static/assets/vendors/phosphoricons/light/style.css">
  <link rel="stylesheet" href="/static/assets/vendors/phosphoricons/thin/style.css">
  <link rel="manifest" href="/static/assets/crafty.webmanifest" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Zaza Gang" />
  <link rel="apple-touch-icon" href="/static/assets/images/brand/zaza-icon.png" />
  <!-- endinject -->
  <!-- Plugin css for this page -->
  <!-- End Plugin css for this page -->
  <!-- Layout styles -->
  <link rel="stylesheet" href="/static/assets/css/themes/default.css">
  <link rel="stylesheet" href="/static/assets/css/base-style.css">
  <link rel="stylesheet" href="/static/assets/css/crafty.css">
  <!-- End Layout styles -->
  <link rel="stylesheet" href="/static/assets/css/project-theme.css">
  <link rel="stylesheet" href="/static/assets/css/dashboard-redesign.css">
  <link rel="shortcut icon" type="image/png" href="/static/assets/images/brand/zaza-icon.png" />
  <link rel="alternate icon" href="/static/assets/images/favicon.png" />
</head>

<body class="dashboard-theme">
  <div class="container-scroller">
    <div class="container-fluid page-body-wrapper full-page-wrapper">
      <div class="content-wrapper d-flex align-items-sm-center auth auth-bg-1 theme-one">
        <div class="mx-auto">
          <div class="auto-form-wrapper h-100">{% block content %} {% end %}</div>
        </div>
      </div>
      <!-- content-wrapper ends -->
    </div>
    <!-- page-body-wrapper ends -->
  </div>
  <!-- page-body-wrapper ends -->

  <!-- container-scroller -->
  <!-- plugins:js -->
  <script src="/static/assets/vendors/js/vendor.bundle.base.js"></script>
  <!-- endinject -->
  <!-- inject:js -->
  <script src="/static/assets/js/shared/off-canvas.js"></script>
  <script src="/static/assets/js/shared/hoverable-collapse.js"></script>
  <script src="/static/assets/js/shared/misc.js"></script>
  <!-- endinject -->

  {% block js %}
  <!-- Custom js for this page -->
  <script>
    $(document).ready(function () {
      let login_opacity_div = document.getElementById('login_opacity');
      let opacity = login_opacity_div.getAttribute('data-value');
      document.getElementById('login-form-background').style.background = 'rgba(13, 27, 16, ' + (opacity / 100) + ')';
      //Register Service worker for mobile app
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/assets/js/shared/service-worker.js', { scope: '/' })
          .then(function (registration) {
            console.error('Service Worker Registered');
          });
      }
    });

  </script>
  <!-- End custom js for this page -->
  {% end %}

</body>

</html>
